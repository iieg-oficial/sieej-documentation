<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documentación de pipeline ETL-SIEEJ</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1f2733;--muted:#667085;--line:#e3e8ef;
--brand:#5C2472;--brand2:#5C2472;--accent:#f5eef8;--pri:#5C2472;--sec:#465055;--warn:#FF8300;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
font-family:'Segoe UI',Roboto,-apple-system,Helvetica,Arial,sans-serif;line-height:1.55;font-size:15px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px 60px}
header.hero{background:#5C2472;color:#fff;
padding:34px 0 28px;margin-bottom:26px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
header.hero .wrap{padding-bottom:0}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85;margin:0 0 6px}
header.hero h1{margin:0;font-size:30px;font-weight:700}
header.hero .dataset{margin:6px 0 0;font-size:16px;opacity:.95}
.badges{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px}
.badge{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);
padding:4px 11px;border-radius:999px;font-size:12.5px;backdrop-filter:blur(2px)}
.back{display:inline-block;color:#fff;opacity:.9;text-decoration:none;font-size:13px}
.back:hover{opacity:1;text-decoration:underline}
section.card{background:var(--card);border:1px solid var(--line);border-radius:12px;
padding:22px 24px;margin:0 0 20px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
h2{margin:0 0 14px;font-size:19px;color:var(--brand);display:flex;align-items:center;gap:9px;
border-bottom:2px solid var(--accent);padding-bottom:9px}
h2 .ico{font-size:18px}
h3{margin:18px 0 8px;font-size:15px;color:var(--ink)}
h3 .tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;margin-left:8px;vertical-align:middle}
.tag.pri{background:#f0e6f6;color:var(--pri)}
.tag.sec{background:#e8eaeb;color:var(--sec)}
p{margin:0 0 10px}
.lead{font-size:15.5px;color:#2b3645}
.muted{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;margin:6px 0 4px;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--accent);color:#33475b;font-weight:600;font-size:12.5px;
text-transform:uppercase;letter-spacing:.03em}
tbody tr:hover{background:#fafbfd}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
code,.mono{font-family:'JetBrains Mono',Consolas,Menlo,monospace;font-size:12.5px;
background:#f0f3f7;padding:1.5px 6px;border-radius:5px;color:#243b53;word-break:break-all}
.src-grid{display:grid;grid-template-columns:170px 1fr;gap:0}
.src-grid dt{font-weight:600;color:#33475b;padding:9px 12px;border-bottom:1px solid var(--line)}
.src-grid dd{margin:0;padding:9px 12px;border-bottom:1px solid var(--line)}
.src-grid a{color:var(--brand);word-break:break-all}
.erd{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:8px;height:480px;cursor:grab;user-select:none;-webkit-user-select:none}
.erd.dragging{cursor:grabbing}
.erd svg{width:100%;height:100%;display:block}
.erd-ctrl{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:5px;z-index:10}
.erd-btn{background:#fff;border:1px solid var(--line);border-radius:7px;width:32px;height:32px;font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12);padding:0;line-height:1;transition:background .15s,border-color .15s}
.erd-btn:hover{background:var(--accent);border-color:var(--brand);color:var(--brand)}
.sched{font-family:'JetBrains Mono',Consolas,monospace;font-size:12.5px;color:#243b53;white-space:nowrap}
footer{color:var(--muted);font-size:12.5px;text-align:center;margin-top:28px;
border-top:1px solid var(--line);padding-top:16px}
.note{background:#fffaf0;border:1px solid #fde9c8;color:#8a5a00;border-radius:8px;
padding:10px 14px;font-size:13px;margin:4px 0 0}
.view-detail{margin:12px 0 8px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.view-detail summary{cursor:pointer;padding:10px 16px;background:var(--accent);font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:10px;user-select:none;-webkit-user-select:none;list-style:none}
.view-detail summary::-webkit-details-marker{display:none}
.view-detail summary::before{content:"\25B6";font-size:9px;color:var(--muted);transition:transform .18s;flex-shrink:0}
.view-detail[open] summary::before{transform:rotate(90deg)}
.view-detail .vcnt{margin-left:auto;color:var(--muted);font-weight:400;font-size:12px;white-space:nowrap}
.view-detail table{margin:0;font-size:13px;border-radius:0;border:none}
.view-detail th:first-child,.view-detail td:first-child{width:38px;text-align:right;color:var(--muted);font-size:11.5px;padding-right:8px}
.dtype{font-family:'JetBrains Mono',Consolas,monospace;font-size:11.5px;background:#f0f3f7;padding:1.5px 6px;border-radius:5px;color:#243b53}
.hero-logos{display:flex;align-items:center;gap:0;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,.18)}
.hero-logo-iieg{height:66px;width:auto}
.hero-logo-sep{width:1px;height:54px;background:rgba(255,255,255,.28);margin:0 20px}
.hero-logo-jal{height:50px;width:auto}
.hero-dir{margin:8px 0 18px;font-size:13.5px;color:rgba(255,255,255,.82);letter-spacing:.02em}
@media(max-width:640px){.src-grid{grid-template-columns:1fr}.src-grid dt{border-bottom:none;padding-bottom:0}}

/* ── Layout con sidebar ──────────────────────────────────── */
.page-layout{display:flex;align-items:flex-start}
.sidenav{width:224px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;
  background:#fff;border-right:1px solid var(--line);padding:10px 0;z-index:50;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.sidenav-back{display:flex;align-items:center;gap:6px;padding:8px 14px 10px;
  border-bottom:1px solid var(--line);color:var(--muted);text-decoration:none;
  font-size:12.5px;transition:color .12s}
.sidenav-back:hover{color:var(--brand)}
.sidenav-title{display:block;font-size:10px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);padding:10px 14px 6px}
.sidenav a.sn-item{display:block;padding:5px 14px;font-size:12.5px;color:#374151;
  text-decoration:none;border-left:3px solid transparent;transition:background .1s,color .1s;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidenav a.sn-item:hover{background:var(--accent);color:var(--brand)}
.sidenav a.sn-item.active{background:#f0e6f6;border-left-color:var(--brand);
  color:var(--brand);font-weight:600}
.main-area{flex:1;min-width:0}
/* ── Navegación anterior / siguiente ─────────────────────── */
.header-nav{display:flex;align-items:center;justify-content:space-between;
  margin-top:14px;gap:10px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:5px;color:#fff;opacity:.8;
  text-decoration:none;font-size:13px;flex-shrink:0}
.back:hover{opacity:1;text-decoration:underline}
.prevnext{display:flex;gap:6px}
.nav-btn{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.28);color:#fff;text-decoration:none;
  padding:5px 13px;border-radius:20px;font-size:12.5px;white-space:nowrap;
  transition:background .15s}
.nav-btn:hover{background:rgba(255,255,255,.28)}
.nav-btn.disabled{opacity:.28;pointer-events:none;cursor:default}
@media(max-width:820px){.sidenav{display:none}.main-area{width:100%}}
</style>
</head>
