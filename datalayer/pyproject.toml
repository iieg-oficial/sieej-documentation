[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sieej-datalayer"
version = "0.1.0"
description = "Capa de datos de la landing SIEEJ: consulta Airflow y PostgreSQL (solo lectura) y genera los JSON que consume el sitio"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
sieej-datalayer = "sieej_datalayer.__main__:main"

[tool.setuptools.packages.find]
include = ["sieej_datalayer*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
