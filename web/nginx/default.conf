server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Location relativo en redirects: el puerto público (mapeo/proxy) no es el del contenedor
    absolute_redirect off;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    # El índice de pipelines fue reemplazado por el catálogo de la landing
    location = /docs/ {
        return 301 /#catalogo;
    }

    location = /docs/index.html {
        return 301 /#catalogo;
    }

    # Los documentos HTML de pipelines se volvieron páginas del sitio
    location = /docs/censos_economicos.html {
        return 301 /pipelines/censo_economico/;
    }

    location ~ ^/docs/([a-z0-9_]+)\.html$ {
        return 301 /pipelines/$1/;
    }

    # Sitio estático generado por Astro; URLs de directorio terminan en /index.html
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    # Activos con hash: caché larga
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /salud {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
